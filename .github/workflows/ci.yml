name: CI - Build Flutter APK & IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-apk:
    name: Flutter - Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.x"
          channel: "stable"
          cache: true

      - name: Install dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Generate localization
        working-directory: ./frontend
        run: flutter gen-l10n

      - name: Build APK (split per ABI)
        working-directory: ./frontend
        run: flutter build apk --release --split-per-abi

      - name: Build APK (universal)
        working-directory: ./frontend
        run: flutter build apk --release

      - name: Rename APKs
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd frontend/build/app/outputs/flutter-apk
          mv app-release.apk shuangtang-v${VERSION}-universal.apk 2>/dev/null || true
          mv app-armeabi-v7a-release.apk shuangtang-v${VERSION}-armeabi-v7a.apk 2>/dev/null || true
          mv app-arm64-v8a-release.apk shuangtang-v${VERSION}-arm64-v8a.apk 2>/dev/null || true
          mv app-x86_64-release.apk shuangtang-v${VERSION}-x86_64.apk 2>/dev/null || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shuangtang-apk
          path: frontend/build/app/outputs/flutter-apk/shuangtang-v*.apk
          retention-days: 30

  build-appbundle:
    name: Flutter - Build AAB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.x"
          channel: "stable"
          cache: true

      - name: Install dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Generate localization
        working-directory: ./frontend
        run: flutter gen-l10n

      - name: Build App Bundle
        working-directory: ./frontend
        run: flutter build appbundle --release

      - name: Rename AAB
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mv frontend/build/app/outputs/bundle/release/app-release.aab \
             frontend/build/app/outputs/bundle/release/shuangtang-v${VERSION}.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: shuangtang-aab
          path: frontend/build/app/outputs/bundle/release/shuangtang-v*.aab
          retention-days: 30

  build-ipa:
    name: Flutter - Build IPA (unsigned)
    runs-on: macos-latest
    if: false  # IPA 需要 Apple Developer 签名，默认禁用；需用时设为 true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.x"
          channel: "stable"
          cache: true

      - name: Install dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Generate localization
        working-directory: ./frontend
        run: flutter gen-l10n

      - name: Generate iOS platform files
        working-directory: ./frontend
        run: flutter create --project-name shuangtang_app --platforms=ios .

      - name: Build iOS
        working-directory: ./frontend
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p build/ios/ipa/Payload
          cp -r frontend/build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r ../../../shuangtang_v${VERSION}_ios.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: shuangtang-ipa
          path: shuangtang_v*_ios.ipa
          retention-days: 30

  release:
    name: GitHub Release
    needs: [build-apk, build-appbundle]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          FILES=""
          [ -d "artifacts/shuangtang-apk" ] && FILES="$FILES artifacts/shuangtang-apk/*.apk"
          [ -d "artifacts/shuangtang-aab" ] && FILES="$FILES artifacts/shuangtang-aab/*.aab"
          [ -d "artifacts/shuangtang-ipa" ] && FILES="$FILES artifacts/shuangtang-ipa/*.ipa"
          gh release create "${VERSION}" \
            --title "双糖 v${VERSION#v}" \
            --notes "自动构建于 $(date -u +'%Y-%m-%d %H:%M UTC')" \
            $FILES
