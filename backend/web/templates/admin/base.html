<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fef3f2;
            color: #333;
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(135deg, #FF9A9E, #FECF86);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            box-shadow: 0 2px 12px rgba(255, 154, 158, 0.3);
        }
        .navbar h1 { font-size: 20px; font-weight: 600; }
        .navbar a { color: white; text-decoration: none; margin-left: 20px; opacity: 0.9; }
        .navbar a:hover { opacity: 1; }
        .container { max-width: 960px; margin: 0 auto; padding: 32px 16px; }
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .card h2 { font-size: 18px; margin-bottom: 16px; color: #FF9A9E; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; color: #666; margin-bottom: 4px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px 12px; border: 1px solid #e0e0e0;
            border-radius: 8px; font-size: 14px; transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none; border-color: #FF9A9E; box-shadow: 0 0 0 3px rgba(255,154,158,0.1);
        }
        .btn {
            display: inline-block; padding: 10px 24px; border: none; border-radius: 8px;
            font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #FF9A9E, #FECF86); color: white;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255,154,158,0.3); }
        .btn-secondary { background: #f5f5f5; color: #666; }
        .btn-secondary:hover { background: #e8e8e8; }
        .alert {
            padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px;
        }
        .alert-success { background: #e8f5e9; color: #2e7d32; }
        .alert-error { background: #fce4e4; color: #c62828; }
        .nav-links { display: flex; align-items: center; }
        .lang-badge {
            background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 12px;
            font-size: 12px; margin-left: 12px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>🍬 双糖控制台</h1>
        <div class="nav-links">
            <span class="lang-badge">中文</span>
            <a href="/admin/dashboard">仪表盘</a>
            <a href="/admin/smtp">SMTP</a>
            <a href="/admin/templates">邮件模板</a>
            <a href="/admin/settings">系统配置</a>
            <a href="/admin/logout">退出</a>
        </div>
    </nav>
    <div class="container">
        {{if .success}}<div class="alert alert-success">{{.success}}</div>{{end}}
        {{if .error}}<div class="alert alert-error">{{.error}}</div>{{end}}
        {{block "content" .}}{{end}}
    </div>
</body>
</html>
