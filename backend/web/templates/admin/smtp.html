{{template "base.html" .}}
{{define "content"}}
<div class="card">
    <h2>📧 SMTP 邮件配置</h2>
    <form method="POST" action="/admin/smtp/save">
        <div class="form-group">
            <label>SMTP 服务器</label>
            <input type="text" name="smtp_host" value="{{index .configs "smtp_host"}}" placeholder="smtp.example.com">
        </div>
        <div class="form-group">
            <label>端口</label>
            <input type="number" name="smtp_port" value="{{index .configs "smtp_port"}}" placeholder="587">
        </div>
        <div class="form-group">
            <label>发件邮箱</label>
            <input type="email" name="smtp_user" value="{{index .configs "smtp_user"}}" placeholder="noreply@shuangtang.app">
        </div>
        <div class="form-group">
            <label>密码/授权码</label>
            <input type="password" name="smtp_pass" placeholder="输入 SMTP 密码">
        </div>
        <div class="form-group">
            <label>发件人地址</label>
            <input type="email" name="smtp_from" value="{{index .configs "smtp_from"}}" placeholder="noreply@shuangtang.app">
        </div>
        <button type="submit" class="btn btn-primary">保存配置</button>
    </form>
</div>

<div class="card">
    <h2>🧪 测试邮件发送</h2>
    <form method="POST" action="/admin/smtp/test">
        <div class="form-group">
            <label>接收测试邮件的邮箱</label>
            <input type="email" name="test_email" placeholder="输入测试邮箱地址">
        </div>
        <button type="submit" class="btn btn-secondary">发送测试邮件</button>
    </form>
</div>
{{end}}
