{{template "base.html" .}}
{{define "content"}}
<div class="card">
    <h2>📊 系统概览</h2>
    <p style="color: #888; margin-bottom: 16px;">双糖后端管理控制台</p>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
        <div style="background: #fef3f2; padding: 20px; border-radius: 12px; text-align: center;">
            <div style="font-size: 28px; font-weight: 700; color: #FF9A9E;">双糖</div>
            <div style="color: #888; font-size: 13px; margin-top: 4px;">应用名称</div>
        </div>
        <div style="background: #f0f8ff; padding: 20px; border-radius: 12px; text-align: center;">
            <div style="font-size: 28px; font-weight: 700; color: #4a90d9;">中/EN</div>
            <div style="color: #888; font-size: 13px; margin-top: 4px;">支持语言</div>
        </div>
        <div style="background: #f0fff4; padding: 20px; border-radius: 12px; text-align: center;">
            <div style="font-size: 28px; font-weight: 700; color: #4caf50;">API</div>
            <div style="color: #888; font-size: 13px; margin-top: 4px;">RESTful 接口</div>
        </div>
    </div>
</div>

<div class="card">
    <h2>🔧 快捷操作</h2>
    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
        <a href="/admin/smtp" class="btn btn-primary">配置 SMTP</a>
        <a href="/admin/templates" class="btn btn-primary">编辑邮件模板</a>
        <a href="/admin/settings" class="btn btn-primary">系统设置</a>
    </div>
</div>
{{end}}
