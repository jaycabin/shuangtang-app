name: shuangtang_app
description: 双糖 - 情侣专属私密空间
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # Network
  dio: ^5.4.0
  web_socket_channel: ^2.4.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utils
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  photo_view: ^0.15.0
  share_plus: ^7.2.1
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.3.0
  geolocator: ^11.0.0
  geocoding: ^2.1.1
  intl_phone_number_input: ^2.0.1
  flutter_svg: ^2.0.9
  lottie: ^3.1.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/
