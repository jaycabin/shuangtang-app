name: shuangtang_app
description: 双糖 - 情侣专属私密空间
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.18.1

  # Network
  dio: ^5.4.0
  web_socket_channel: ^2.4.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utils
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  permission_handler: ^11.3.0
  geolocator: ^11.0.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/
